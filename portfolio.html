    <div id="lightbox" role="dialog" aria-modal="true">
        <button id="lb-close" aria-label="Bezárás">&times;</button>
        <button id="lb-prev" aria-label="Előző">&#8592;</button>

    <script>
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');
        const lbClose_ = document.getElementById('lb-close');
        const lbPrev_ = document.getElementById('lb-prev');
        const lbNext_ = document.getElementById('lb-next');
        const lbFocusable = [lbClose_, lbPrev_, lbNext_];
        let lbImages = [], lbIndex = 0, lbTrigger = null;

        function lbOpen(imgs, i, triggerEl) {
            lbImages = imgs; lbIndex = i;
            lbTrigger = triggerEl || document.activeElement;
            lbImg.src = lbImages[lbIndex];
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
            lbClose_.focus();
        }
        function lbClose() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
            lbImg.src = '';
            if (lbTrigger) lbTrigger.focus();
        }
        function lbStep(dir) { lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length; lbImg.src = lbImages[lbIndex]; }

        lbClose_.addEventListener('click', lbClose);
        lbPrev_.addEventListener('click', () => lbStep(-1));
        lbNext_.addEventListener('click', () => lbStep(1));
        lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });
        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') lbClose();
            if (e.key === 'ArrowLeft') lbStep(-1);
            if (e.key === 'ArrowRight') lbStep(1);
            if (e.key === 'Tab') {
                const first = lbFocusable[0], last = lbFocusable[lbFocusable.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            }
        });

        const tiles = [...document.querySelectorAll('#gallery > div')];
        const srcs = tiles.map(t => t.querySelector('img').src);
        tiles.forEach((tile, i) => {
            tile.addEventListener('click', () => lbOpen(srcs, i, tile));
            tile.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lbOpen(srcs, i, tile); }
            });
        });
    </script>
